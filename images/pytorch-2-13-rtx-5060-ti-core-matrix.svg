.row{font:700 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#111827}
.cell-main{font:700 17px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#ffffff}
.cell-sub{font:700 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#ffffff;letter-spacing:.04em}
.pass{fill:#166534;stroke:#14532d;stroke-width:2}.fail{fill:#991b1b;stroke:#7f1d1d;stroke-width:2}
.footnote{font:12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#4b5563}
</style>
