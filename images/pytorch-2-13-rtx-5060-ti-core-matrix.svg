<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" role="img" aria-labelledby="core-title core-desc">
<title id="core-title">PyTorch 2.13 CUDA wheel core matrix on an RTX 5060 Ti</title>
<desc id="core-desc"> Original eager core matrix. cu126: metadata 3 of 3 passed, 1-byte alloc/fill/read 0 of 3 passed, FP32 vector add, n=4096 0 of 3 passed, FP32 dot, n=1 3 of 3 passed, FP32 dot, n=4 3 of 3 passed, FP32 dot, n=32 3 of 3 passed, FP32 dot, n=1024 3 of 3 passed, FP32 (x*y).sum(), n=4 0 of 3 passed, FP32 ones GEMM, 512x512 0 of 3 passed, BF16 ones GEMM, 512x512 0 of 3 passed. cu130: metadata 3 of 3 passed, 1-byte alloc/fill/read 3 of 3 passed, FP32 vector add, n=4096 3 of 3 passed, FP32 dot, n=1 3 of 3 passed, FP32 dot, n=4 3 of 3 passed, FP32 dot, n=32 3 of 3 passed, FP32 dot, n=1024 3 of 3 passed, FP32 (x*y).sum(), n=4 3 of 3 passed, FP32 ones GEMM, 512x512 3 of 3 passed, BF16 ones GEMM, 512x512 3 of 3 passed. cu132: metadata 3 of 3 passed, 1-byte alloc/fill/read 3 of 3 passed, FP32 vector add, n=4096 3 of 3 passed, FP32 dot, n=1 3 of 3 passed, FP32 dot, n=4 3 of 3 passed, FP32 dot, n=32 3 of 3 passed, FP32 dot, n=1024 3 of 3 passed, FP32 (x*y).sum(), n=4 3 of 3 passed, FP32 ones GEMM, 512x512 3 of 3 passed, BF16 ones GEMM, 512x512 3 of 3 passed. Compile and post-hoc probes are excluded.</desc>
